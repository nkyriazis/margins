name: ci

on:
  push:
  pull_request:

jobs:
  cli:
    name: script and hook (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/cli.sh "$PWD"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning skills/margins/margins.sh skills/margins/hooks/rearm.sh bin/margins tests/*.sh

  plugin:
    name: claude plugin validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin test .
